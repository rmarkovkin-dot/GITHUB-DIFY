        opening_statement: '-= КАК НАЗЫВАЮТСЯ МАГАЗИНЫ В ПРОГРАММЕ=-

          Энгельса, Санаторная, Нариманова, Порт, Воздушная, Котельниково, ВЛКСМ,
          Никитина, Калач, Покупалка, Сидорова, Батова, Штеменко, Родниковая


          -= ДЛЯ ПРОВЕРКИ ЗАКАЗОВ ПРОДАВЦОВ=-

          Покажи продажи только по следующим позициям в магазине НАЗВАНИЕ НУЖНОГО
          МАГАЗИНА, хочу понять какую заявку сделать по ним на неделю. Сделай мне
          просто вывод списком в формате "Название позиции" + "Количество за 7 дней".
          Обязательно дай данные по всем позициям, продавались ли они и сколько.


          (скопируй позиции из заказа)

          - Позиция 1

          - Позиция 2

          ....

          - Позиция N


          -= ДЛЯ ПОНИМАНИЯ, ЧТО ЗАКАЗАТЬ И СКОЛЬКО=-

          (если нужно понять по всей группе товаров)

          Рассчитай объем заказа на следующие 2 недели по группе "НАЗВАНИЕ ГРУППЫ"
          с учетом страхового запаса 15%.


          (подставляем нужное название группы)

          - Арахис

          - Сыры

          - Рыбные снеки

          - Мясные снеки

          - Гренки и сухарики


          (если нужно понять по конкретным позициям)

          Рассчитай объем заказа на следующие 2 недели по товарам "НАЗВАНИЕ ТОВАРА
          1", "НАЗВАНИЕ ТОВАРА 2"....."НАЗВАНИЕ ТОВАРА N" с учетом страхового запаса
          15%.


          -= ДЛЯ ПОНИМАНИЯ, КАКИЕ ПОЗИЦИИ ИЗ ВСЕГО АССОРТИМЕНТА ЯВЛЯЮТСЯ БАЛАСТОМ

          Какие позиции в группе "НАЗВАНИЕ ГРУППЫ" показали продажи менее 15 кг за
          месяц по всей сети и подлежат выводу без повторной закупки?


          -= ДЛЯ ПОНИМАНИЯ, КАКИЕ ПОЗИЦИИ ПРОДАЮТСЯ (сколько, как и где. Полный анализ)=-

          Сделай полный операционный отчет по категории "НАЗВАНИЕ ГРУППЫ": сколько
          реализовано в килограммах/штуках, какие магазины лидируют по объему, а в
          каких точках товар отсутствовал.


          -= ДЛЯ ОБЩЕГО РАЗВИТИЯ=-

          Какова текущая ситуация с товародвижением по группе "НАЗВАНИЕ ГРУППЫ"?'
