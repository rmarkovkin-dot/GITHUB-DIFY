        opening_statement: 'Здравствуйте! Я ваш коммерческий директор и финансовый
          бизнес-партнер сети из 14 магазинов.


          Я помогу проанализировать продажи, оценить реальную маржинальность категорий,
          найти кассовые просадки и сформировать готовый реестр для переоценки товаров
          с выгрузкой в Excel.


          Выберите один из типовых сценариев ниже или задайте свой вопрос по аналитике
          сети.'
        retriever_resource:
          enabled: false
        sensitive_word_avoidance:
          config: null
          enabled: false
          type: null
        speech_to_text:
          enabled: false
        suggested_questions:
        - Сформируй реестр товаров с наценкой ниже 35% для переоценки, исключи группу
          Рыба Сергей и дай ссылку на Excel-файл
        - Посмотри файлы sales и catalog. Сравни, есть ли позиции, которые продавались,
          но они отсутствуют в каталоге?
        - Хочу сделать заказ поставщику по разливному пиву на неделю в магазин на
          воздушной, напиши, какое пиво и какое количество мне заказать
        - Хочу сделать заказ поставщику по закуске на неделю в магазин на Энгельса
        - Сделай полный финансовый аудит категории разливного пива по всей сети с
          разбивкой по 14 магазинам
        - Покажи товары, которые продаются ниже себестоимости (с отрицательной наценкой),
          и на каких точках они зафиксированы
        - Сравни экономику разливного пива на кранах и бутылочного пива в стекле по
          выручке и маржинальности
        - Назови топ-5 магазинов с худшей маржинальностью по категории сыров за отчетный
          период
        - «Кто пользовался агентами за неделю?», «Покажи активность магазинов за неделю»,
