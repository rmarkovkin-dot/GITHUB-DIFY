    - data:
        code: "import json\nimport re\nfrom collections import defaultdict\n\ndef\
          \ main(args):\n    # Входная переменная из HTTP-запроса к Google Apps Script\n\
          \    http_body = args.get(\"http_body\", \"\")\n    if not http_body or\
          \ not isinstance(http_body, str):\n        return {\"report\": \"ERROR:\
          \ Нет данных лога или неверный формат входных данных.\"}\n\n    # B11: Словарь\
          \ нормализации. Схлопывает все варианты написания в 14 канонических названий.\n\
          \    # Ключи — к нижнему регистру, без лишних пробелов.\n    CANONICAL_STORES\
          \ = {\n        # Энгельса\n        'энгельса': 'Энгельса', 'энгельс': 'Энгельса',\n\
          \        # Санаторная\n        'санаторная': 'Санаторная', 'санатор': 'Санаторная',\
          \ 'sanatorn': 'Санаторная', 'санаторн': 'Санаторная',\n        # Нариманова\n\
          \        'нариманова': 'Нариманова', 'нариманов': 'Нариманова', 'нариман':\
          \ 'Нариманова', 'nariman': 'Нариманова',\n        # Порт\n        'порт':\
          \ 'Порт', 'порт-саида': 'Порт',\n        # Воздушная\n        'воздушная':\
          \ 'Воздушная', 'воздушн': 'Воздушная', 'возд': 'Воздушная', 'vozd': 'Воздушная',\n\
          \        '8 воздушной': 'Воздушная', '8-й воздушной': 'Воздушная', '8воздушной':\
          \ 'Воздушная',\n        # Котельниково\n        'котельниково': 'Котельниково',\
          \ 'котельников': 'Котельниково', 'котельник': 'Котельниково',\n        #\
          \ ВЛКСМ\n        'влксм': 'ВЛКСМ', 'vlksm': 'ВЛКСМ',\n        # Никитина\n\
          \        'никитина': 'Никитина', 'никитин': 'Никитина', 'никит': 'Никитина',\n\
          \        # Калач\n        'калач': 'Калач', 'kalach': 'Калач',\n       \
          \ # Покупалка\n        'покупалка': 'Покупалка', 'покупалк': 'Покупалка',\n\
          \        # Сидорова\n        'сидорова': 'Сидорова', 'сидоров': 'Сидорова',\
          \ 'sidor': 'Сидорова',\n        # Батова\n        'батова': 'Батова', 'батов':\
          \ 'Батова', 'batov': 'Батова',\n        # Штеменко\n        'штеменко':\
          \ 'Штеменко', 'штем': 'Штеменко', 'shtemenko': 'Штеменко', 'shtmen': 'Штеменко',\n\
          \        # Родниковая\n        'родниковая': 'Родниковая', 'родник': 'Родниковая',\
          \ 'rodnik': 'Родниковая',\n        # Служебные / Тестовые\n        'закупки':\
          \ 'Закупки (тест)'\n    }\n\n    # Структуры для агрегации\n    store_totals\
          \ = defaultdict(int)\n    store_categories = defaultdict(lambda: defaultdict(int))\n\
          \    total_requests = 0\n\n    # Парсинг лога построчно\n    lines = http_body.strip().split('\\\
          n')\n    for line in lines:\n        if not line.strip():\n            continue\n\
          \        \n        # Формат строки: \"Дата Время Магазин Категория\" (разделены\
          \ пробелами/табуляцией)\n        # Пример: \"2026-09-30 15:56:15 vozd snacks\"\
          \n        parts = line.strip().split()\n        if len(parts) < 4:\n   \
          \         continue\n        \n        # Дата и время — первые два токена,\
          \ категория — последний, магазин — всё между ними\n        category = parts[-1].strip().lower()\n\
          \        raw_store = \" \".join(parts[2:-1]).strip().lower()\n        \n\
          \        # Нормализация: ищем в словаре, если нет — оставляем как есть (title\
          \ case)\n        canonical_store = CANONICAL_STORES.get(raw_store, raw_store.title())\n\
          \        \n        # Пропускаем совсем мусорные строки (неизвестный магазин\
          \ и не из словаря)\n        if canonical_store not in CANONICAL_STORES.values()\
          \ and raw_store not in CANONICAL_STORES:\n            continue\n\n     \
          \   total_requests += 1\n        store_totals[canonical_store] += 1\n  \
          \      store_categories[canonical_store][category] += 1\n\n    # Классификация\
          \ магазинов по активности\n    active_stores = []\n    low_stores = []\n\
          \    zero_stores = []\n    \n    # Список всех 14 основных магазинов сети\n\
          \    ALL_14_STORES = [\n        'Энгельса', 'Санаторная', 'Нариманова',\
          \ 'Порт', 'Воздушная',\n        'Котельниково', 'ВЛКСМ', 'Никитина', 'Калач',\
          \ 'Покупалка',\n        'Сидорова', 'Батова', 'Штеменко', 'Родниковая'\n\
          \    ]\n\n    for store in ALL_14_STORES:\n        count = store_totals.get(store,\
          \ 0)\n        if count >= 3:\n            active_stores.append((store, count))\n\
          \        elif count > 0:\n            low_stores.append((store, count))\n\
          \        else:\n            zero_stores.append(store)\n\n    # \"Закупки\
          \ (тест)\" — отдельно, не входит в 14 магазинов\n    test_count = store_totals.get('Закупки\
          \ (тест)', 0)\n    if test_count > 0:\n        active_stores.append(('Закупки\
          \ (тест)', test_count))\n\n    # Сортировка по убыванию обращений\n    active_stores.sort(key=lambda\
          \ x: x[1], reverse=True)\n    low_stores.sort(key=lambda x: x[1], reverse=True)\n\
          \    zero_stores.sort()\n\n    # Формирование сырого вывода для агента Комдира\n\
          \    report_lines = []\n    report_lines.append(f\"SUMMARY|{total_requests}|{len(active_stores)\
          \ + len(low_stores)}\")\n    \n    for store, count in active_stores:\n\
          \        cats = \", \".join([f\"{k}: {v}\" for k, v in sorted(store_categories[store].items(),\
          \ key=lambda item: item[1], reverse=True)])\n        report_lines.append(f\"\
          ACTIVE|{store}|{count}|{cats}\")\n        \n    for store, count in low_stores:\n\
          \        cats = \", \".join([f\"{k}: {v}\" for k, v in sorted(store_categories[store].items(),\
          \ key=lambda item: item[1], reverse=True)])\n        report_lines.append(f\"\
          LOW|{store}|{count}|{cats}\")\n        \n    for store in zero_stores:\n\
          \        report_lines.append(f\"ZERO|{store}\")\n\n    return {\"report\"\
          : \"\\n\".join(report_lines)}"
        code_language: python3
