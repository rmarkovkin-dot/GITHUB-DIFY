        opening_statement: "Привет! Я твой цифровой помощник по формированию заказов\
          \ для твоего магазина сети.\n\nЯ помогу рассчитать ориентировочный объём\
          \ закупки на неделю по реальным продажам твоей точки, подскажу проверенные\
          \ новинки сети для витрины и подсвечу позиции с низким спросом.\n\nКАК ЭТО\
          \ РАБОТАЕТ? \n• Выберите нужный вариант заказа кнопкой ниже \n• Дайте мне\
          \ около минуты на обработку данных из базы \n• Я проведу полный расчёт и\
          \ выдам готовый понятный отчёт\n\nОБЯЗАТЕЛЬНО К ПРОЧТЕНИЮ ПЕРЕД ЗАКАЗОМ:\
          \ Я выдаю сухую математическую статистику продаж за последние 30 дней и\
          \ вижу только чистые цифры, но не знаю контекста работы магазина.\n\nИменно\
          \ поэтому здесь критически важно подключить человеческий анализ и свой мозг:\n\
          • Новинки: если товар привезли недавно, логично, что у него будет слабая\
          \ статистика, так как он продавался короткий отрезок времени. Это не делает\
          \ его плохим товаром, но я могу отнести его к этой группе.\n• Сбои поставок:\
          \ если позиции не было 1–2 недели из-за отсутствия на складе поставщика,\
          \ её продажи за месяц отобразятся некорректно заниженными.\n• Локальный\
          \ спрос: всегда учитывайте особенности покупателей именно вашей смены и\
          \ точки.\n• Ошибки на кассе и пересорт: если на склад поступили, например,\
          \ «Чипсы пшеничные», а на кассе их по ошибке пробивали как «Гренки пшеничные»,\
          \ то в отчёте чипсы будут выглядеть неликвидом, а гренки — хитом продаж,\
          \ хотя в реальности всё ровно наоборот.\n\nВАЖНО! Используйте мои расчёты\
          \ как удобную базу, но окончательное решение по объёмам всегда принимайте\
          \ с учётом реальной ситуации на полках!\n\nКаждый новый расчёт необходимо\
          \ запускать строго в новом окне (новом чате), чтобы история сообщений не\
          \ переплеталась с предыдущим ответом."
